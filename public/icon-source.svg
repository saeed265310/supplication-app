    dominant-baseline="middle">ذكر</text>

  <!-- Decorative elements - prayer beads style -->
  <circle cx="256" cy="140" r="12" fill="rgba(255,255,255,0.6)"/>
  <circle cx="290" cy="150" r="10" fill="rgba(255,255,255,0.5)"/>
  <circle cx="320" cy="170" r="10" fill="rgba(255,255,255,0.5)"/>

  <circle cx="256" cy="372" r="12" fill="rgba(255,255,255,0.6)"/>
  <circle cx="222" cy="362" r="10" fill="rgba(255,255,255,0.5)"/>
  <circle cx="192" cy="342" r="10" fill="rgba(255,255,255,0.5)"/>
</svg>
