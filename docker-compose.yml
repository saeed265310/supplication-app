services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: supplication-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    volumes:
      - ./data:/app/data
    ports:
      - "3002:3001"  # Using 3002 to avoid conflict with other services
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - supplication-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3002/api}
    container_name: supplication-frontend
    restart: unless-stopped
    ports:
      - "8081:80"  # Using 8081 to avoid conflict with nginx proxy manager
    depends_on:
      - backend
    networks:
      - supplication-network

volumes:
  database:
    driver: local

networks:
  supplication-network:
    driver: bridge
