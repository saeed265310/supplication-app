services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: supplication-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - PORT=3001
      - CORS_ORIGIN=https://supplication.saeed201.duckdns.org
    volumes:
      - ./data:/app/data

    # Port removed - backend only accessible via frontend proxy
    # ports:
    #   - "3002:3001"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - supplication-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Use relative URL - API requests go through Caddy proxy
        - VITE_API_URL=/api
    container_name: supplication-frontend
    restart: unless-stopped
    ports:
      - "8081:80"  # Using 8081 to avoid conflict with nginx proxy manager
    depends_on:
      - backend
    networks:
      - supplication-network

volumes:
  database:
    driver: local

networks:
  supplication-network:
    driver: bridge
